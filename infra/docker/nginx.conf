# Serves the built single-page application and proxies the API.
#
# The proxy matters for more than convenience: it puts the browser, the app and
# the API on one origin, so the session cookie is first-party and SameSite=lax
# behaves the way it is meant to.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # nginx inherits add_header from the enclosing level ONLY when the current
  # level declares none of its own. Both blocks below set Cache-Control, so the
  # security headers at the bottom of this file would be dropped for exactly the
  # two responses that most need them — the entry document above all, since "/"
  # reaches it by internal redirect and re-runs location matching. They are
  # therefore repeated here rather than inherited. Do not delete them as
  # duplicates.

  # Hashed assets never change; the entry document must never be cached.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
  }

  location /graphql {
    proxy_pass http://api:4000/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # An import upload can be large and a close can be slow.
    client_max_body_size 32m;
    proxy_read_timeout 120s;
  }

  location ~ ^/(healthz|readyz|webhooks) {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Client-side routing: any unknown path is a route, not a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Modest hardening. The app loads no third-party scripts.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
}
