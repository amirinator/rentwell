name: rentwell

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentwell}
      POSTGRES_DB: ${POSTGRES_DB:-rentwell}
      # Deterministic ordering/formatting for reproducible demo output.
      LANG: C
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - log_min_duration_statement=500
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rentwell} -d ${POSTGRES_DB:-rentwell}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-rentwell}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-rentwell-local-secret}
    ports:
      - '9000:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the private import bucket and denies anonymous access.
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/scripts/init-minio.sh']
    environment:
      S3_BUCKET: ${S3_BUCKET:-rentwell-imports}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rentwell}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rentwell-local-secret}
    volumes:
      - ./infra/minio:/scripts:ro
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    profiles: ['full']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rentwell}:${POSTGRES_PASSWORD:-rentwell}@postgres:5432/${POSTGRES_DB:-rentwell}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    env_file: [.env]
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    profiles: ['full']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rentwell}:${POSTGRES_PASSWORD:-rentwell}@postgres:5432/${POSTGRES_DB:-rentwell}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    env_file: [.env]

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    profiles: ['full']
    depends_on:
      api: { condition: service_started }
    ports:
      - '5173:80'

volumes:
  postgres-data:
  redis-data:
  minio-data:
