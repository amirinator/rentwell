}

# ---------------------------------------------------------------------------
# Billing
# ---------------------------------------------------------------------------

type Charge {
  id: ID!
  type: ChargeType!
  status: ChargeStatus!
  description: String!
  amount: Money!
  allocatedAmount: Money!
  creditedAmount: Money!
  openBalance: Money!
  serviceStart: Date!
  serviceEnd: Date!
  dueDate: Date!
  postingDate: Date!
  period: Period!
  "How many days past due on the reporting date, or 0 when not yet due."
  daysPastDue: Int!
  "Inputs and intermediate values of the proration that produced the amount."
  calculation: JSON!
  property: Property!
  lease: Lease!
  tenant: Tenant!
  scheduleVersion: ChargeScheduleVersion
  allocations: [Allocation!]!
  credits: [CreditAdjustment!]!
  version: Int!
}

type ChargeEdge {
  cursor: String!
  node: Charge!
}

type ReceivableConnection {
  edges: [ChargeEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
  "Totals over the whole filtered set, not just the current page."
  totals: ReceivableTotals!
}

type ReceivableTotals {
  charged: Money!
  allocated: Money!
  credited: Money!
  outstanding: Money!
}

type CreditAdjustment {
  id: ID!
  amount: Money!
  reason: String!
  postingDate: Date!
  period: Period!
  createdAt: DateTime!
}

type ProposedCharge {
  generationKey: String!
  type: ChargeType!
  description: String!
  amount: Money!
  serviceStart: Date!
  serviceEnd: Date!
  dueDate: Date!
  lease: Lease!
  tenant: Tenant!
  calculation: JSON!
}

type GenerationWarning {
  code: String!
  message: String!
  leaseId: ID!
  scheduleId: ID
}

type ChargePreview {
  period: Period!
  propertyId: ID!
  proposed: [ProposedCharge!]!
  "Generation keys already present. Re-running generation skips these."
  skippedKeys: [String!]!
  warnings: [GenerationWarning!]!
  totalAmount: Money!
  leaseCount: Int!
}

type GenerationResult {
  period: Period!
  propertyId: ID!
  createdCount: Int!
  skippedCount: Int!
  totalAmount: Money!
  warnings: [GenerationWarning!]!
  charges: [Charge!]!
}

# ---------------------------------------------------------------------------
# Ingestion
# ---------------------------------------------------------------------------

type BankAccount {
  id: ID!
  label: String!
  maskedNumber: String!
  currency: String!
  isActive: Boolean!
  property: Property!
  provider: String
  lastSyncedAt: DateTime
}

type ImportValidationError {
  rowNumber: Int
  column: String
  code: String!
  message: String!
  value: String
}

type ImportBatch {
  id: ID!
  status: ImportStatus!
  originalFilename: String!
  fileSizeBytes: Int!
  fileHash: String!
  totalRows: Int!
  processedRows: Int!
  createdRows: Int!
  duplicateRows: Int!
  failedRows: Int!
  checkpointRow: Int!
  validationErrors: [ImportValidationError!]!
  errorMessage: String
  attempts: Int!
  property: Property!
  bankAccount: BankAccount!
  createdAt: DateTime!
  confirmedAt: DateTime
  completedAt: DateTime
  "Signed, short-lived URL. Null unless the viewer may download the source file."
  downloadUrl: String
  rows(first: Int = 50, after: String, outcome: String): ImportRowConnection!
}

type ImportRow {
  id: ID!
  rowNumber: Int!
  externalId: String
  outcome: String!
  message: String
  rawValues: JSON!
  transaction: BankTransaction
}

type ImportRowEdge {
  cursor: String!
  node: ImportRow!
}

type ImportRowConnection {
  edges: [ImportRowEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ImportUpload {
  importId: ID!
  "PUT the file here. Expires shortly; mint a new one rather than reusing it."
  uploadUrl: String!
  storageKey: String!
  expiresAt: DateTime!
}

type ImportValidation {
  importId: ID!
  status: ImportStatus!
  totalRows: Int!
  validRows: Int!
  errors: [ImportValidationError!]!
  "Confirmation must quote this hash, binding it to the bytes that were validated."
  fileHash: String!
}

type BankTransaction {
  id: ID!
  source: TransactionSource!
  externalId: String!
  direction: TransactionDirection!
  status: TransactionStatus!
  amount: Money!
  allocatedAmount: Money!
  unappliedAmount: Money!
  postedDate: Date!
  postingDate: Date!
  period: Period!
  reference: String
  "Payer-supplied text. Treated as untrusted data everywhere in the system."
  description: String
  property: Property!
  bankAccount: BankAccount!
  allocations: [Allocation!]!
  suggestions: [MatchSuggestion!]!
  exception: ReconciliationException
  reversedAt: DateTime
  reversalReason: String
  version: Int!
}

type TransactionEdge {
  cursor: String!
  node: BankTransaction!
}

type TransactionConnection {
  edges: [TransactionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
  totals: TransactionTotals!
}

type TransactionTotals {
  received: Money!
  allocated: Money!
  unapplied: Money!
}

# ---------------------------------------------------------------------------
# Reconciliation
# ---------------------------------------------------------------------------

type MatchEvidence {
  kind: String!
  label: String!
  recordIds: [ID!]!
  "Points this evidence contributed to the ranking score."
  contribution: Float!
}

"""
Points contributed by each matching signal, out of 100.

Named `*Points` so nothing here reads as a monetary value: none of these is
money, and the total is a ranking, not a probability.
"""
type ScoreComponents {
  referencePoints: Float!
  amountPoints: Float!
  datePoints: Float!
  descriptionPoints: Float!
  totalPoints: Float!
}

type SuggestedAllocation {
  charge: Charge!
  amount: Money!
}

type MatchSuggestion {
  id: ID!
  strategy: MatchStrategy!
  status: SuggestionStatus!
  lines: [SuggestedAllocation!]!
  totalAmount: Money!
  remainder: Money!
  """
  Ranking score, not a probability. It orders candidates for human review and
  must not be presented as a confidence percentage.
  """
  score: Float!
  scoreComponents: ScoreComponents!
  evidence: [MatchEvidence!]!
  warnings: [String!]!
  ruleVersion: String!
  generatedAt: DateTime!
  "True when the records it was computed against have changed since."
  isStale: Boolean!
}

type Allocation {
  id: ID!
  amount: Money!
  status: AllocationStatus!
  postingDate: Date!
  period: Period!
  note: String
  charge: Charge!
  transaction: BankTransaction!
  approvedBy: OrganizationMember
  approvedAt: DateTime!
  reversal: AllocationReversal
}

type AllocationReversal {
  id: ID!
  amount: Money!
  reason: String!
  postingDate: Date!
  createdAt: DateTime!
}

type AllocationResult {
  transaction: BankTransaction!
  allocations: [Allocation!]!
  totalAllocated: Money!
  remainingUnapplied: Money!
  "Exception raised or resolved as a result of this approval."
  exception: ReconciliationException
}

type ReversalResult {
  allocation: Allocation!
  transaction: BankTransaction!
  charge: Charge!
}

type ExceptionComment {
  id: ID!
  body: String!
  authorName: String!
  createdAt: DateTime!
}

type ReconciliationException {
  id: ID!
  category: ExceptionCategory!
  status: ExceptionStatus!
  severity: ExceptionSeverity!
  summary: String!
  isBlocking: Boolean!
  openAmount: Money!
  period: Period!
  property: Property!
  transaction: BankTransaction
  tenant: Tenant
  assignedTo: OrganizationMember
  resolution: ExceptionResolution
  resolutionReason: String
  resolvedBy: OrganizationMember
  resolvedAt: DateTime
  reopenCount: Int!
  comments: [ExceptionComment!]!
  candidateCharges: [Charge!]!
  assistantRuns: [AssistantRun!]!
  createdAt: DateTime!
  version: Int!
}

type ExceptionEdge {
  cursor: String!
  node: ReconciliationException!
}

type ExceptionConnection {
  edges: [ExceptionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# ---------------------------------------------------------------------------
