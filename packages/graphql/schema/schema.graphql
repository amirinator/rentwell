}

# ---------------------------------------------------------------------------
# Root types
# ---------------------------------------------------------------------------

type Query {
  viewer: Viewer

  portfolioSummary(filter: PortfolioFilter!): PortfolioSummary!

  properties(first: Int = 25, after: String, search: String): PropertyConnection!
  property(id: ID!): Property

  tenant(id: ID!): Tenant
  lease(id: ID!): Lease

  receivables(filter: ReceivableFilter!, first: Int = 25, after: String): ReceivableConnection!
  charge(id: ID!): Charge

  imports(filter: ImportFilter, first: Int = 25, after: String): ImportBatchConnection!
  importBatch(id: ID!): ImportBatch

  transactions(filter: TransactionFilter!, first: Int = 25, after: String): TransactionConnection!
  transaction(id: ID!): BankTransaction
  matchSuggestions(transactionId: ID!): [MatchSuggestion!]!

  exceptions(filter: ExceptionFilter!, first: Int = 25, after: String): ExceptionConnection!
  exception(id: ID!): ReconciliationException

  closeReadiness(propertyId: ID!, period: Period!): CloseReadiness!
  closeSnapshots(propertyId: ID!, first: Int = 12): [CloseSnapshot!]!

  journalEntries(filter: JournalFilter!, first: Int = 25, after: String): JournalEntryConnection!
  accountBalances(propertyId: ID!, period: Period!): [AccountBalance!]!

  auditEvents(filter: AuditFilter!, first: Int = 25, after: String): AuditEventConnection!

  assistantRun(id: ID!): AssistantRun

  members: [OrganizationMember!]!
}

type ImportBatchEdge {
  cursor: String!
  node: ImportBatch!
}

type ImportBatchConnection {
  edges: [ImportBatchEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type Mutation {
  signIn(input: SignInInput!): SignInResult!
  signOut: Boolean!

  """
  Computes the charges generation would create, without creating them.

  It writes nothing financial, but it is a mutation rather than a query for two
  reasons: it records an audit event, and its result must never be served from
  a client cache, because an accountant confirming a stale preview is exactly
  the mistake `expectedGenerationKeys` exists to catch.
  """
  previewCharges(input: PreviewChargesInput!): ChargePreview!
  generateCharges(input: GenerateChargesInput!): GenerationResult!
  createCreditAdjustment(input: CreateCreditInput!): Charge!

  createImportUpload(input: CreateImportInput!): ImportUpload!
  validateImport(importId: ID!): ImportValidation!
  confirmImport(input: ConfirmImportInput!): ImportBatch!
  cancelImport(importId: ID!): ImportBatch!
  retryImport(importId: ID!): ImportBatch!

  regenerateSuggestions(input: RegenerateSuggestionsInput!): [MatchSuggestion!]!
  approveAllocations(input: ApproveAllocationsInput!): AllocationResult!
  reverseAllocation(input: ReverseAllocationInput!): ReversalResult!

  assignException(input: AssignExceptionInput!): ReconciliationException!
  resolveException(input: ResolveExceptionInput!): ReconciliationException!
  reopenException(input: ReopenExceptionInput!): ReconciliationException!
  commentOnException(input: CommentOnExceptionInput!): ReconciliationException!

  analyzeException(exceptionId: ID!): AssistantRun!

  startPeriodReview(input: StartPeriodReviewInput!): AccountingPeriod!
  closePeriod(input: ClosePeriodInput!): CloseSnapshot!
  reopenPeriod(input: ReopenPeriodInput!): AccountingPeriod!

  syncProvider(input: SyncProviderInput!): Boolean!
}
