}

type AccountBalance {
  accountCode: LedgerAccountCode!
  "Balance expressed in the account's own normal direction."
  balance: Money!
  debitTotal: Money!
  creditTotal: Money!
}

type AccountingPeriod {
  id: ID!
  period: Period!
  status: PeriodStatus!
  reviewStartedAt: DateTime
  closedAt: DateTime
  reopenedAt: DateTime
  reopenReason: String
  reopenCount: Int!
  version: Int!
  latestSnapshot: CloseSnapshot
}

type CloseBlocker {
  code: String!
  message: String!
  count: Int
  resolutionHint: String!
}

type CloseAcknowledgement {
  code: String!
  message: String!
  count: Int
  amount: Money
  requiresReason: Boolean!
}

type CloseTotals {
  chargesPosted: Money!
  paymentsReceived: Money!
  paymentsAllocated: Money!
  outstandingReceivables: Money!
  unappliedCash: Money!
}

type CloseReadiness {
  property: Property!
  period: Period!
  periodStatus: PeriodStatus!
  blockers: [CloseBlocker!]!
  acknowledgements: [CloseAcknowledgement!]!
  totals: CloseTotals!
  canClose: Boolean!
  evaluatedAt: DateTime!
}

type CloseChecklistItem {
  code: String!
  kind: String!
  satisfied: Boolean!
  message: String!
  reason: String
}

type CloseSnapshot {
  id: ID!
  period: Period!
  property: Property!
  totals: CloseTotals!
  checklist: [CloseChecklistItem!]!
  closedBy: OrganizationMember!
  closedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Dashboard
# ---------------------------------------------------------------------------

type AgingBucket {
  label: String!
  minDaysPastDue: Int!
  maxDaysPastDue: Int
  amount: Money!
  chargeCount: Int!
}

type ExceptionBucket {
  key: String!
  label: String!
  count: Int!
  amount: Money!
}

type PropertyCloseStatus {
  property: Property!
  period: Period!
  status: PeriodStatus!
  blockerCount: Int!
}

type ProcessingHealth {
  failedImports: Int!
  importsInProgress: Int!
  pendingOutboxEvents: Int!
  oldestPendingEventAgeSeconds: Int!
  deadLetterEvents: Int!
}

"""
Portfolio totals.

Every figure states its own basis: which date range it covers, which date field
that range is applied to, and how reversed records are treated. `metricNotes`
carries that description so a number on screen can always be explained.
"""
type PortfolioSummary {
  period: Period!
  propertyIds: [ID!]!
  chargesPosted: Money!
  paymentsReceived: Money!
  paymentsAllocated: Money!
  unappliedCash: Money!
  outstandingReceivables: Money!
  allocationRate: Float!
  suggestionCoverage: Float!
  aging: [AgingBucket!]!
  exceptionsBySeverity: [ExceptionBucket!]!
  exceptionsByOwner: [ExceptionBucket!]!
  closeStatus: [PropertyCloseStatus!]!
  processing: ProcessingHealth!
  "The reporting date aging was calculated against."
  asOfDate: Date!
  refreshedAt: DateTime!
  metricNotes: [MetricNote!]!
}

type MetricNote {
  metric: String!
  "Date field the period filter is applied to, e.g. \"charge.postingDate\"."
  dateBasis: String!
  "How reversed and credited records are counted."
  reversalTreatment: String!
  filters: String!
}

