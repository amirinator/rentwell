# Rentwell GraphQL schema.
#
# Conventions:
#
#  * Money crosses the API as `Money { cents: SafeInt!, currency: String! }`.
#    A minor-unit integer plus its currency cannot be misread as a float and
#    cannot arrive without a currency, which is why there is no `Float` amount
#    anywhere in this schema.
#  * Business dates are `Date` (YYYY-MM-DD, no offset). Instants are
#    `DateTime` (ISO-8601 UTC). Accounting periods are `Period` (YYYY-MM).
#  * Lists that can grow are cursor-paginated Relay-style connections with a
#    bounded `first`.
#  * Mutations that move money take an `idempotencyKey`, so a retried request
#    cannot post twice.
#  * Errors are returned as GraphQL errors carrying a stable
#    `extensions.code` from the domain error vocabulary.

scalar Date
scalar DateTime
scalar Period
scalar SafeInt
scalar JSON

# ---------------------------------------------------------------------------
# Shared
# ---------------------------------------------------------------------------

"An exact monetary amount in minor units, with its currency."
type Money {
  "Signed integer minor units. 1234 in USD means $12.34."
  cents: SafeInt!
  currency: String!
  "Preformatted for display, e.g. \"1,234.56\". Never parsed back by a client."
  formatted: String!
}

input MoneyInput {
  cents: SafeInt!
  currency: String!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# ---------------------------------------------------------------------------
# Enumerations. These mirror the database and domain enumerations exactly.
# ---------------------------------------------------------------------------

enum Role {
  ORG_ADMIN
  PORTFOLIO_CONTROLLER
  ACCOUNTANT
  PROPERTY_MANAGER
  AUDITOR
}

enum PropertyStatus {
  ACTIVE
  INACTIVE
  DISPOSED
}

enum OccupancyStatus {
  VACANT
  OCCUPIED
  OUT_OF_SERVICE
}

enum LeaseStatus {
  DRAFT
  ACTIVE
  EXPIRED
  TERMINATED
}

enum ChargeType {
  BASE_RENT
  OPERATING
  ONE_TIME
}

enum ChargeStatus {
  POSTED
  SETTLED
  VOIDED
}

enum ImportStatus {
  DRAFT
  VALIDATING
  READY
  QUEUED
  PROCESSING
  COMPLETED
  VALIDATION_FAILED
  FAILED
  CANCELLED
}

enum TransactionStatus {
  UNAPPLIED
  PARTIALLY_ALLOCATED
  ALLOCATED
  REVERSED
  EXCLUDED
}

enum TransactionDirection {
  CREDIT
  DEBIT
}

enum TransactionSource {
  CSV_IMPORT
  PROVIDER_SYNC
  PROVIDER_WEBHOOK
  MANUAL
}

enum MatchStrategy {
  EXACT_REFERENCE_AND_AMOUNT
  EXACT_AMOUNT_SINGLE_CHARGE
  REFERENCE_PARTIAL_AMOUNT
  COMBINED_CHARGES
  OVERPAYMENT_WITH_REMAINDER
  DESCRIPTION_HEURISTIC
}

enum SuggestionStatus {
  PROPOSED
  APPROVED
  REJECTED
  SUPERSEDED
}

enum AllocationStatus {
  ACTIVE
  REVERSED
}

enum ExceptionCategory {
  MISSING_REFERENCE
  AMBIGUOUS_MATCH
  UNDERPAYMENT
  OVERPAYMENT
  SUSPECTED_DUPLICATE
  CURRENCY_MISMATCH
  REVERSED_PAYMENT
  INTEGRATION_CONFLICT
}

enum ExceptionStatus {
  OPEN
  ASSIGNED
  IN_REVIEW
  RESOLVED
}

enum ExceptionSeverity {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum ExceptionResolution {
  ALLOCATED
  REVERSED
  CREDIT_ISSUED
  CLASSIFIED_UNAPPLIED
  DUPLICATE_CONFIRMED
  WRITTEN_OFF
  NO_ACTION_REQUIRED
}

enum PeriodStatus {
  OPEN
  IN_REVIEW
  CLOSED
}

enum LedgerAccountCode {
  ACCOUNTS_RECEIVABLE
  RENTAL_INCOME
  OPERATING_CHARGE_INCOME
  CASH_CLEARING
  UNAPPLIED_CASH
}

enum JournalEventType {
  CHARGE_POSTED
  CHARGE_CREDITED
  PAYMENT_RECEIVED
  PAYMENT_ALLOCATED
  ALLOCATION_REVERSED
  PAYMENT_REVERSED
}

enum AssistantRunStatus {
  RUNNING
  SUCCEEDED
  FAILED
  BUDGET_EXCEEDED
}

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------

type Viewer {
  id: ID!
  email: String!
  displayName: String!
  organization: Organization!
  role: Role!
  "Null for organization-scoped roles, which see every property."
  assignedPropertyIds: [ID!]
  "Action strings this viewer may perform. Drives UI affordances only; the server checks again."
  permissions: [String!]!
}

type Organization {
  id: ID!
  slug: String!
  name: String!
  currency: String!
}

type OrganizationMember {
  id: ID!
  userId: ID!
  email: String!
  displayName: String!
  role: Role!
  status: String!
  assignedProperties: [Property!]!
}

