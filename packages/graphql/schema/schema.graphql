  debit: Money!
  credit: Money!
  memo: String!
  chargeId: ID
  tenantId: ID
}

type JournalEntry {
  id: ID!
  postingEventId: String!
  eventType: JournalEventType!
  description: String!
  postingDate: Date!
  businessDate: Date!
  period: Period!
  totalDebit: Money!
  totalCredit: Money!
  lines: [JournalLine!]!
  property: Property!
  sourceType: String!
  sourceId: ID!
  reversesPostingEventId: String
  createdAt: DateTime!
}

type JournalEntryEdge {
  cursor: String!
  node: JournalEntry!
}

type JournalEntryConnection {
  edges: [JournalEntryEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
  "Must be zero. A non-zero value means the subledger is inconsistent."
