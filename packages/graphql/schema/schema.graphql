  timezone: String!
  currency: String!
  status: PropertyStatus!
  unitCount: Int!
  activeLeaseCount: Int!
  outstandingReceivables: Money!
  unappliedCash: Money!
  openExceptionCount: Int!
  units(first: Int = 50, after: String): UnitConnection!
  bankAccounts: [BankAccount!]!
